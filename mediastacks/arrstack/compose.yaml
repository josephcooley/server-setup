services:
  #calibre-web is a web app for managing and reading eBooks.
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:universal-calibre #optional
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1 #optional
    volumes:
      - ${STACKROOT}/stacks/calibre-web:/config
      - ${SHAREROOT}/Books/eBooks:/books
    ports:
      - 8083:8083
    restart: unless-stopped
  #AudioBookshelf is a self-hosted audiobook server that allows you to manage and stream your audiobooks.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - ${STACKROOT}/stacks/audiobookshelf:/config
      - ${SHAREROOT}/Books/Audiobooks:/audiobooks
      - ${SHAREROOT}/Books/Audiobooks:/metadata
    restart: unless-stopped
  #komga is a self-hosted media server for managing and reading comics and manga.     
  komga:
    image: gotson/komga
    container_name: komga
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ${STACKROOT}/stacks/komga:/config
      - ${SHAREROOT}/Books/Comics:/data
    ports:
      - 25600:25600
    restart: unless-stopped
  #shelfmark is a self-hosted application for managing and organizing your book collection. 
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - 8084:8084
    restart: unless-stopped
    volumes:
      - ${SHAREROOT}/Books/ebooks:/books # Default destination for book downloads
      - ${STACKROOT}/stacks/shelfmark:/config # App configuration
      # Required for torrent / usenet - path must match your download client's volume exactly
      - ${SHAREROOT}/Downloads:${SHAREROOT}/Downloads
networks: {}
