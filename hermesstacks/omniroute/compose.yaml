services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    # OmniRoute uses SQLite in WAL mode — it needs time on shutdown to
    # checkpoint the database back to storage.sqlite. Don't lower this.
    stop_grace_period: 40s
    ports:
      - "20128:20128"
    volumes:
      - /opt/stacks/hermes/data:/app/data
    env_file:
      - .env
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      # Uncomment to override the default 512MB Node heap limit:
      # - OMNIROUTE_MEMORY_MB=512
      # Uncomment if you manage backups externally (e.g. via your own
      # volume snapshot tooling) and want to skip OmniRoute's built-in
      # SQLite auto-backup:
      # - DISABLE_SQLITE_AUTO_BACKUP=true
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  omniroute-data: