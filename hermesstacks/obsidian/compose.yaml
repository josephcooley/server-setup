services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/stacks/obsidian/config:/config
    ports:
      - 3010:3000
      - 3011:3001
    labels:
      - traefik.enable=true
      - traefik.http.routers.obsidian.rule=Host(`${OBSIDIAN_HOST:-obsidian.local}`)
      - traefik.http.routers.obsidian.entrypoints=websecure
      - traefik.http.routers.obsidian.tls=true
      - traefik.http.routers.obsidian.tls.certresolver=letsencrypt
      - traefik.http.services.obsidian.loadbalancer.server.port=3000
      - traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}
    shm_size: 1gb
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${TRAEFIK_PROXY_NETWORK:-proxy}
