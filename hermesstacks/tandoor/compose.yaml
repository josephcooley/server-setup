services:
  tandoor_db:
    image: postgres:16-alpine
    container_name: tandoor_db
    restart: always
    expose:
      - 5432
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    env_file:
      - ./.env
    #networks:
    #  - internal

  tandoor_recipes:
    image: vabene1111/recipes:latest
    container_name: tandoor_recipes
    restart: always
    ports:
      - 8082:80
    expose:
      - 80
    env_file:
      - ./.env
    volumes:
      - ./staticfiles:/opt/recipes/staticfiles
      #- ./nginx_config:/opt/recipes/nginx/conf.d
      - ./mediafiles:/opt/recipes/mediafiles
    depends_on:
      - tandoor_db
    #networks:
    #  - proxy
    #  - internal
    #labels:
    #  - traefik.enable=true
    #  - traefik.http.routers.tandoor.rule=Host(`tandoor.example.com`)
    #  - traefik.http.services.tandoor.loadbalancer.server.port=80
    #  - traefik.docker.network=proxy
    #  # Part for local lan services only
    #  #- traefik.http.routers.tandoor.middlewares=local-ipwhitelist@file

    #networks:
    #  proxy:
    #    external: true
    #  internal:
    #    internal: true
networks: {}
