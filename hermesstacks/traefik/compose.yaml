services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - /opt/stacks/obsidian/config:/config
    ports:
      - 3010:3000
      - 3011:3001
    shm_size: 1gb
    restart: unless-stopped
