# Homepage Address: http://${HOMEPAGE_HOST}:3000
- AI Services:
    - Hermes Dashboard:
        href: http://${HOMEPAGE_HOST}:9119
        description: Hermes agent dashboard
        icon: sh-hermes-agent.png

    - Hermes WebUI:
        href: http://${HOMEPAGE_HOST}:8787
        description: Hermes web interface
        icon: mdi-chat
    
    - Manifest:
        href: http://${HOMEPAGE_HOST}:8085
        description: Manifest
        icon: sh-manifest.png
    
    - Dozzle:
        href: http://${HOMEPAGE_HOST}:2099
        description: Dozzle log viewer
        icon: dozzle
        
- Home Automation:
    - Home Assistant:
        href: http://${HOMEPAGE_HOST}:8123
        description: Home automation
        icon: home-assistant
        widget:
          type: homeassistant
          url: http://${HOMEPAGE_HOST}:8123
          key: ${HOMEPAGE_HOME_ASSISTANT_KEY}
    - Frigate:
        href: http://${HOMEPAGE_HOST}:5420
        description: NVR and object detection
        icon: frigate
        widget:
          type: frigate
          url: http://${HOMEPAGE_HOST}:5420

- Development:
    - Dockge:
        href: http://${HOMEPAGE_HOST}:5001
        description: Dockge container manager
        icon: dockge
    - Code Server:
        href: http://${HOMEPAGE_HOST}:8443
        description: VS Code in the browser
        icon: vscode
    - Filebrowser:
        href: http://${HOMEPAGE_HOST}:8383
        description: Filebrowser file manager
        icon: filebrowser
        widget:
          type: filebrowser
          url: http://${HOMEPAGE_HOST}:8383
          username: Joseph
          password: ${HOMEPAGE_FILEBROWSER_PASSWORD}
